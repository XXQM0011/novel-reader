<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小说阅读器</title>
  <script>
    (() => {
      try {
        const savedFontSize = Number(localStorage.getItem("reader.fontSize"));

        if (
          Number.isInteger(savedFontSize) &&
          savedFontSize >= 14 &&
          savedFontSize <= 28
        ) {
          document.documentElement.style.setProperty(
            "--font-size",
            `${savedFontSize}px`
          );
        }

        if (localStorage.getItem("reader.theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {
        console.error(error);
      }
    })();
  </script>
  <style>
    :root {
      /* 阅读字号：用户可调，保留原变量名 */
      --font-size: 18px;

      /* 间距阶梯 */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;

      /* 字号阶梯 */
      --text-xs: 12px;
      --text-sm: 13px;
      --text-base: 15px;
      --text-lg: 17px;
      --text-xl: 22px;

      /* 行高 */
      --leading-tight: 1.35;
      --leading-normal: 1.6;
      --leading-reading: 1.8;

      /* 圆角 */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;

      /* 动效 */
      --dur-fast: 120ms;
      --dur-base: 180ms;
      --ease: cubic-bezier(.2,.7,.3,1);

      /* 表面层级（浅色） */
      --surface-0: #f5f2eb;
      --surface-1: #fffdf9;
      --surface-2: #efe9df;
      --border-subtle: rgba(60,48,30,.12);
      --border-strong: rgba(60,48,30,.22);

      /* 文字层级（浅色） */
      --text-primary: #292929;
      --text-secondary: #6b6259;
      --text-muted: #958c81;

      /* 主色 */
      --accent: #3f6f5e;
      --accent-strong: #2f5b4c;
      --accent-contrast: #ffffff;
      --focus-ring: rgba(63,111,94,.35);

      /* 兼容旧变量名：其余 280 行 CSS 一行不用改 */
      --bg: var(--surface-0);
      --fg: var(--text-primary);
    }

    :root.dark {
      --surface-0: #181a1c;
      --surface-1: #202326;
      --surface-2: #282c30;
      --border-subtle: rgba(255,255,255,.10);
      --border-strong: rgba(255,255,255,.18);

      --text-primary: #e8e3d8;
      --text-secondary: #a9a196;
      --text-muted: #7d766c;

      --accent: #4f9b7f;
      --accent-strong: #3f8069;
      --accent-contrast: #0e1311;
      --focus-ring: rgba(79,155,127,.45);
    }
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--fg);
      background: var(--bg);
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body[data-view="shelf"] #reading-content {
      display: none;
    }

    body[data-view="reader"] #shelf {
      display: none;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 16px;
      padding: 16px;
      background: var(--bg);
      border-bottom: 1px solid rgba(128, 128, 128, 0.2);
    }

    .font-size-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--fg);
    }

    .font-size-slider {
      width: min(180px, 45vw);
      accent-color: #3f6f5e;
      cursor: pointer;
    }

    .file-button,
    .theme-button,
    .back-button {
      min-height: 44px;
      padding: 10px 24px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }

    .file-button {
      color: #fff;
      background: #3f6f5e;
    }

    .theme-button {
      color: var(--bg);
      background: var(--fg);
    }

    .back-button {
      color: var(--fg);
      background: transparent;
      border: 1px solid rgba(128, 128, 128, 0.45);
    }

    .file-button:active,
    .theme-button:active,
    .back-button:active {
      opacity: 0.8;
    }

    .file-button:active {
      background: #31594b;
    }

    .file-button:focus-visible,
    .theme-button:focus-visible,
    .back-button:focus-visible {
      outline: 3px solid rgba(63, 111, 94, 0.35);
      outline-offset: 3px;
    }

    .reading-content {
      max-width: 720px;
      min-height: 60vh;
      margin: 0 auto;
      padding: 24px 32px 64px;
      border-radius: 8px;
      color: var(--fg);
      background: var(--bg);
      box-shadow: 0 4px 24px rgba(50, 40, 20, 0.08);
      font-size: var(--font-size);
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    :root.dark .reading-content {
      box-shadow: none;
    }

    .reading-content:empty::before {
      content: "请选择一个 TXT 文件开始阅读";
      color: var(--fg);
      opacity: 0.55;
    }

    .loading {
      max-width: 720px;
      margin: 20px auto 0;
      padding: 0 32px;
      color: var(--fg);
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
      opacity: 0.55;
    }

    #loading:not([hidden]) + #reading-content:empty::before {
      content: none;
    }

    .shelf {
      max-width: 720px;
      margin: 20px auto 0;
      padding: 0 32px;
    }

    .shelf-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .shelf-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid rgba(128, 128, 128, 0.2);
      border-radius: 8px;
      color: var(--fg);
      background: var(--bg);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .shelf-item:focus-visible {
      outline: 3px solid rgba(63, 111, 94, 0.35);
      outline-offset: 2px;
    }

    .shelf-title {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      font-size: 15px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shelf-chars {
      flex: none;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0.55;
    }

    .shelf-progress {
      flex: none;
      margin-left: 8px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .shelf-delete {
      flex: none;
      min-width: 36px;
      min-height: 32px;
      padding: 4px 8px;
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 6px;
      color: var(--fg);
      background: transparent;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .shelf-delete:focus-visible {
      outline: 3px solid rgba(63, 111, 94, 0.35);
      outline-offset: 2px;
    }

    .shelf-empty {
      margin: 0;
      padding: 16px 0;
      color: var(--fg);
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
      opacity: 0.55;
    }

    .reading-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      padding: 8px 16px;
      border-radius: 999px;
      color: var(--bg);
      background: var(--fg);
      font-size: 14px;
      line-height: 1.5;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .reading-toast.show {
      opacity: 0.92;
      transform: translate(-50%, 0);
    }

    .storage-usage {
      position: fixed;
      right: 12px;
      bottom: max(8px, env(safe-area-inset-bottom));
      z-index: 8;
      padding: 3px 6px;
      border-radius: 4px;
      color: var(--fg);
      background: var(--bg);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      line-height: 1.4;
      white-space: nowrap;
      opacity: 0.72;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .toolbar {
        padding: 12px;
      }

      .reading-content {
        padding: 20px 16px 48px;
        border-radius: 0;
        box-shadow: none;
      }

      .loading {
        padding: 0 16px;
      }

      .shelf {
        padding: 0 16px;
      }
    }
  </style>
</head>
<body data-view="shelf">
  <div class="toolbar">
    <input
      id="file-input"
      type="file"
      accept=".txt,.md,text/plain"
      hidden
    >
    <button id="select-file" class="file-button" type="button">
      选择文件
    </button>
    <button
      id="back-to-shelf"
      class="back-button"
      type="button"
      hidden
    >
      ← 书架
    </button>
    <label class="font-size-control" for="font-size">
      字号
      <input
        id="font-size"
        class="font-size-slider"
        type="range"
        min="14"
        max="28"
        step="1"
        value="18"
      >
    </label>
    <button id="theme-toggle" class="theme-button" type="button">
      切换夜间模式
    </button>
  </div>

  <section id="shelf" class="shelf" aria-label="书架">
    <div id="shelf-list" class="shelf-list"></div>
    <p id="shelf-empty" class="shelf-empty" hidden>
      还没有书，点上面导入一本
    </p>
  </section>

  <div id="loading" class="loading" hidden>正在打开上次那本书…</div>
  <div id="reading-content" class="reading-content"></div>
  <div
    id="reading-toast"
    class="reading-toast"
    role="status"
    aria-live="polite"
  ></div>
  <div
    id="storage-usage"
    class="storage-usage"
    aria-live="polite"
    hidden
  ></div>

  <script>
    const fileInput = document.getElementById("file-input");
    const selectButton = document.getElementById("select-file");
    const backToShelf = document.getElementById("back-to-shelf");
    const readingContent = document.getElementById("reading-content");
    const fontSizeInput = document.getElementById("font-size");
    const themeToggle = document.getElementById("theme-toggle");
    const readingToast = document.getElementById("reading-toast");
    const storageUsage = document.getElementById("storage-usage");
    const loading = document.getElementById("loading");
    const shelfList = document.getElementById("shelf-list");
    const shelfEmpty = document.getElementById("shelf-empty");
    const root = document.documentElement;
    let currentBookKey = null;
    let progressSaveTimer = null;
    let toastTimer = null;
    let loadSeq = 0;

    const DB_NAME = "reader";
    const DB_VERSION = 2;
    const BOOK_STORE = "books";
    const META_STORE = "meta";
    const LAST_BOOK_KEY = "reader.lastBookKey";

    // 不同域名 = 不同的 IndexedDB 数据库。
    let dbPromise = null;

    function showShelfView() {
      document.body.dataset.view = "shelf";
      backToShelf.setAttribute("hidden", "");
    }

    function applyReaderView() {
      document.body.dataset.view = "reader";
      backToShelf.removeAttribute("hidden");
    }

    function showReaderView() {
      const isEnteringReader = document.body.dataset.view !== "reader";

      applyReaderView();

      // 历史栈：
      // 初始 [shelf] -> 从书架打开书籍 [shelf, reader]
      // 返回或物理返回键 [shelf]；反向切换只出栈，绝不 push。
      if (isEnteringReader) {
        history.pushState({ view: "reader" }, "");
      }
    }

    function openDB() {
      if (dbPromise !== null) {
        return dbPromise;
      }

      dbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = () => {
          const db = request.result;

          if (!db.objectStoreNames.contains(BOOK_STORE)) {
            db.createObjectStore(BOOK_STORE);
          }

          if (!db.objectStoreNames.contains(META_STORE)) {
            db.createObjectStore(META_STORE);
          }
        };

        request.onsuccess = () => {
          const db = request.result;

          db.onversionchange = () => {
            db.close();
            dbPromise = null;
          };

          resolve(db);
        };

        request.onerror = () => {
          dbPromise = null;
          reject(request.error);
        };
      });

      return dbPromise;
    }

    async function putBook(bookKey, buffer) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(BOOK_STORE, "readwrite");

        transaction.objectStore(BOOK_STORE).put(buffer, bookKey);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    async function putBookMeta(bookKey, meta) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(META_STORE, "readwrite");

        transaction.objectStore(META_STORE).put(meta, bookKey);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    async function getAllBookMeta() {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(META_STORE, "readonly");
        const request = transaction.objectStore(META_STORE).getAll();

        request.onsuccess = () => resolve(request.result ?? []);
        request.onerror = () => reject(request.error);
      });
    }

    async function deleteBookMeta(bookKey) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(META_STORE, "readwrite");

        transaction.objectStore(META_STORE).delete(bookKey);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    async function getBook(bookKey) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(BOOK_STORE, "readonly");
        const request = transaction.objectStore(BOOK_STORE).get(bookKey);

        request.onsuccess = () => resolve(request.result ?? null);
        request.onerror = () => reject(request.error);
      });
    }

    async function deleteBook(bookKey) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(BOOK_STORE, "readwrite");

        transaction.objectStore(BOOK_STORE).delete(bookKey);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    function saveSetting(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (error) {
        console.error(error);
      }
    }

    function removeSetting(key) {
      try {
        localStorage.removeItem(key);
      } catch (error) {
        console.error(error);
      }
    }

    function showLoadingState() {
      readingContent.setAttribute("aria-busy", "true");
      readingContent.textContent = "正在载入……";
    }

    function clearLoadingState() {
      readingContent.removeAttribute("aria-busy");
    }

    async function updateStorageUsage() {
      if (!navigator.storage?.estimate) {
        return;
      }

      try {
        const { usage, quota } = await navigator.storage.estimate();
        const usedMB = (Number(usage) || 0) / (1024 * 1024);
        const quotaGB = (Number(quota) || 0) / (1024 * 1024 * 1024);

        storageUsage.textContent =
          `已用 ${usedMB.toFixed(2)} MB · 上限 ${quotaGB.toFixed(2)}GB`;
        storageUsage.hidden = false;
      } catch (error) {
        console.error(error);
      }
    }

    function getSavedFontSize() {
      try {
        const value = Number(localStorage.getItem("reader.fontSize"));
        return Number.isInteger(value) && value >= 14 && value <= 28
          ? value
          : null;
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    const savedFontSize = getSavedFontSize();

    if (savedFontSize !== null) {
      fontSizeInput.value = String(savedFontSize);
    }

    function getScrollElement() {
      return document.scrollingElement || document.documentElement;
    }

    function getProgressKey(bookKey) {
      return `reader.progress:${bookKey}`;
    }

    function getSavedProgress(bookKey) {
      try {
        const savedValue = localStorage.getItem(getProgressKey(bookKey));

        if (savedValue === null) {
          return null;
        }

        const progress = Number(savedValue);
        return Number.isFinite(progress) && progress >= 0 && progress <= 1
          ? progress
          : null;
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    async function renderShelf() {
      try {
        // 书架只对 meta 调用 getAll；绝不能对 books 调用 getAll：
        // 会把所有正文一次性读进内存，20 本 5MB 的书就是 100MB。
        const metas = await getAllBookMeta();

        metas.sort(
          (first, second) =>
            (Number(second.lastReadAt) || 0) -
            (Number(first.lastReadAt) || 0)
        );

        shelfList.replaceChildren();
        shelfEmpty.hidden = metas.length > 0;

        for (const meta of metas) {
          // 书名是用户可控内容，必须使用 createElement + textContent，禁止 innerHTML 拼接，避免 XSS。
          const item = document.createElement("div");
          const title = document.createElement("span");
          const chars = document.createElement("span");
          const progress = document.createElement("span");
          const deleteButton = document.createElement("button");
          const savedProgress = getSavedProgress(meta.bookKey) ?? 0;
          const charCount = Number(meta.chars) || 0;

          item.className = "shelf-item";
          item.tabIndex = 0;
          item.setAttribute("role", "button");

          title.className = "shelf-title";
          title.textContent = String(meta.name ?? "").replace(/\.txt$/i, "");

          chars.className = "shelf-chars";
          chars.textContent = `${charCount.toLocaleString("zh-CN")} 字`;

          progress.className = "shelf-progress";
          progress.textContent = `${Math.round(savedProgress * 100)}%`;

          deleteButton.type = "button";
          deleteButton.className = "shelf-delete";
          deleteButton.textContent = "删";
          deleteButton.setAttribute("aria-label", `删除 ${title.textContent}`);
          deleteButton.addEventListener("click", (event) => {
            event.stopPropagation();
            deleteShelfBook(meta.bookKey);
          });

          item.append(title, chars, progress, deleteButton);
          item.dataset.bookKey = String(meta.bookKey ?? "");
          shelfList.append(item);
        }
      } catch (error) {
        shelfList.replaceChildren();
        shelfEmpty.hidden = false;
        console.error(error);
      }
    }

    async function openShelfBook(bookKey) {
      // 切换视图会隐藏正文并改变布局，必须在离开阅读视图前保存当前进度。
      saveReadingProgress();
      clearTimeout(progressSaveTimer);

      const seq = ++loadSeq;
      currentBookKey = null;
      loading.hidden = true;
      showLoadingState();

      try {
        // 只读取当前这一本正文，不对 books 表执行 getAll。
        const buffer = await getBook(bookKey);

        if (seq !== loadSeq) {
          return;
        }

        if (buffer === null) {
          return;
        }

        currentBookKey = bookKey;

        const text = decodeText(buffer);
        readingContent.textContent = text;
        saveSetting(LAST_BOOK_KEY, bookKey);

        const metas = await getAllBookMeta();

        if (seq !== loadSeq) {
          return;
        }

        const existingMeta = metas.find((meta) => meta.bookKey === bookKey);

        if (existingMeta) {
          await putBookMeta(bookKey, {
            ...existingMeta,
            lastReadAt: Date.now(),
          });

          if (seq !== loadSeq) {
            return;
          }

          await renderShelf();

          if (seq !== loadSeq) {
            return;
          }
        }

        // 正文在书架视图中是隐藏的，先切视图再让双层 rAF 计算并恢复滚动位置。
        showReaderView();
        window.scrollTo(0, 0);
        restoreReadingProgress(bookKey, seq);
      } catch (error) {
        if (seq !== loadSeq) {
          return;
        }

        readingContent.textContent = "载入失败，请重新选择文件。";
        console.error(error);
      } finally {
        if (seq === loadSeq) {
          clearLoadingState();
        }
      }
    }

    async function deleteShelfBook(bookKey) {
      if (!confirm("删掉这本书？正文和阅读进度都会没。")) {
        return;
      }

      try {
        await deleteBook(bookKey);

        await deleteBookMeta(bookKey);

        localStorage.removeItem(getProgressKey(bookKey));

        if (localStorage.getItem(LAST_BOOK_KEY) === bookKey) {
          localStorage.removeItem(LAST_BOOK_KEY);
        }
      } catch (error) {
        console.error(error);
        showToast("删除失败，请稍后重试");
      } finally {
        await renderShelf();
      }
    }

    // 书架条目由 renderShelf 动态创建，因此统一在列表上使用事件委托。
    shelfList.addEventListener("click", (event) => {
      if (!(event.target instanceof Element)) {
        return;
      }

      const item = event.target.closest(".shelf-item");

      if (!item) {
        return;
      }

      const bookKey = item.dataset.bookKey;

      if (bookKey) {
        openShelfBook(bookKey);
      }
    });

    shelfList.addEventListener("keydown", (event) => {
      if (
        (event.key !== "Enter" && event.key !== " ") ||
        !(event.target instanceof Element) ||
        event.target.closest(".shelf-delete")
      ) {
        return;
      }

      const item = event.target.closest(".shelf-item");

      if (!item || event.target !== item) {
        return;
      }

      const bookKey = item.dataset.bookKey;

      if (bookKey) {
        event.preventDefault();
        openShelfBook(bookKey);
      }
    });

    backToShelf.addEventListener("click", () => {
      // 切换视图会隐藏当前滚动容器，因此必须在隐藏正文之前保存进度。
      saveReadingProgress();
      clearTimeout(progressSaveTimer);

      if (history.state?.view === "reader") {
        history.back();
        return;
      }

      ++loadSeq;
      currentBookKey = null;
      showShelfView();
      renderShelf();
      window.scrollTo(0, 0);
    });

    window.addEventListener("popstate", (event) => {
      const target = event.state?.view === "reader" ? "reader" : "shelf";

      // 不能只看 body.dataset.view：后退后界面是 shelf，再前进时它仍然是 shelf，
      // 只看当前视图会误以为无须切换，导致历史指针与界面错位。
      if (target === "reader") {
        if (document.body.dataset.view !== "reader") {
          try {
            currentBookKey = localStorage.getItem(LAST_BOOK_KEY);
          } catch (error) {
            console.error(error);
            currentBookKey = null;
          }

          applyReaderView();
        }

        return;
      }

      saveReadingProgress();
      clearTimeout(progressSaveTimer);

      ++loadSeq;
      currentBookKey = null;
      showShelfView();
      renderShelf();
      window.scrollTo(0, 0);
    });

    function showToast(message) {
      readingToast.textContent = message;
      readingToast.classList.add("show");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        readingToast.classList.remove("show");
      }, 2000);
    }

    function showReadingToast() {
      showToast("已回到上次阅读位置");
    }

    function restoreReadingProgress(bookKey, seq) {
      const savedProgress = getSavedProgress(bookKey);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (seq !== loadSeq) {
            return;
          }

          const scrollElement = getScrollElement();
          const maxScroll = scrollElement.scrollHeight - window.innerHeight;
          const progress = savedProgress ?? 0;

          scrollElement.scrollTop = maxScroll > 0 ? progress * maxScroll : 0;

          if (savedProgress !== null && savedProgress > 0) {
            showReadingToast();
          }
        });
      });
    }

    function saveReadingProgress() {
      if (currentBookKey === null) {
        return;
      }

      const scrollElement = getScrollElement();
      const maxScroll = scrollElement.scrollHeight - window.innerHeight;
      const progress =
        maxScroll > 0 ? scrollElement.scrollTop / maxScroll : 0;

      saveSetting(getProgressKey(currentBookKey), String(progress));
    }

    function detectUtf16Encoding(bytes) {
      const sampleLength = Math.min(bytes.length, 4096);
      let evenZeros = 0;
      let oddZeros = 0;
      let pairs = 0;

      for (let index = 0; index + 1 < sampleLength; index += 2) {
        if (bytes[index] === 0) {
          evenZeros++;
        }

        if (bytes[index + 1] === 0) {
          oddZeros++;
        }

        pairs++;
      }

      if (pairs < 4) {
        return null;
      }

      const evenRatio = evenZeros / pairs;
      const oddRatio = oddZeros / pairs;

      if (oddRatio >= 0.2 && oddRatio > evenRatio * 3) {
        return "utf-16le";
      }

      if (evenRatio >= 0.2 && evenRatio > oddRatio * 3) {
        return "utf-16be";
      }

      return null;
    }

    function replacementRatio(text) {
      let replacements = 0;
      let characters = 0;

      for (const character of text) {
        characters++;

        if (character === "\uFFFD") {
          replacements++;
        }
      }

      return characters === 0 ? 0 : replacements / characters;
    }

    function decodeText(buffer) {
      const bytes = new Uint8Array(buffer);

      if (
        bytes[0] === 0xef &&
        bytes[1] === 0xbb &&
        bytes[2] === 0xbf
      ) {
        return new TextDecoder("utf-8").decode(bytes.subarray(3));
      }

      if (bytes[0] === 0xff && bytes[1] === 0xfe) {
        return new TextDecoder("utf-16le").decode(bytes.subarray(2));
      }

      if (bytes[0] === 0xfe && bytes[1] === 0xff) {
        return new TextDecoder("utf-16be").decode(bytes.subarray(2));
      }

      const utf16Encoding = detectUtf16Encoding(bytes);

      if (utf16Encoding !== null) {
        return new TextDecoder(utf16Encoding).decode(bytes);
      }

      try {
        return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      } catch {
        // 严格解码失败只说明“不是纯 UTF-8”，不说明“不是 UTF-8”。
      }

      const utf8Text = new TextDecoder("utf-8").decode(bytes);

      if (replacementRatio(utf8Text) < 0.05) {
        return utf8Text;
      }

      let bestText = "";
      let bestRatio = Infinity;

      for (const encoding of ["gbk", "utf-16le", "utf-16be"]) {
        const text = new TextDecoder(encoding).decode(bytes);
        const ratio = replacementRatio(text);

        if (ratio < bestRatio) {
          bestText = text;
          bestRatio = ratio;
        }
      }

      return bestText;
    }

    async function openLastBook() {
      let lastBookKey = null;

      try {
        lastBookKey = localStorage.getItem(LAST_BOOK_KEY);
      } catch (error) {
        console.error(error);
      }

      if (!lastBookKey) {
        return;
      }

      const seq = ++loadSeq;
      loading.hidden = false;

      try {
        const buffer = await getBook(lastBookKey);

        if (seq !== loadSeq) {
          return;
        }

        if (buffer === null) {
          removeSetting(LAST_BOOK_KEY);
          readingContent.textContent = "";
          return;
        }

        const text = decodeText(buffer);
        readingContent.textContent = text;
        currentBookKey = lastBookKey;
        showReaderView();
        window.scrollTo(0, 0);
        restoreReadingProgress(lastBookKey, seq);
      } catch (error) {
        if (seq !== loadSeq) {
          return;
        }

        readingContent.textContent = "载入失败，请重新选择文件。";
        console.error(error);
      } finally {
        loading.hidden = true;
      }
    }

    selectButton.addEventListener("click", () => {
      fileInput.click();
    });

    fontSizeInput.addEventListener("input", () => {
      root.style.setProperty("--font-size", `${fontSizeInput.value}px`);
      saveSetting("reader.fontSize", fontSizeInput.value);
    });

    themeToggle.addEventListener("click", () => {
      const isDark = root.classList.toggle("dark");
      saveSetting("reader.theme", isDark ? "dark" : "light");
    });

    window.addEventListener(
      "scroll",
      () => {
        clearTimeout(progressSaveTimer);
        progressSaveTimer = setTimeout(() => {
          saveReadingProgress();
        }, 200);
      },
      { passive: true }
    );

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      const seq = ++loadSeq;
      const bookKey = `${file.name}::${file.size}`;

      clearTimeout(progressSaveTimer);
      saveReadingProgress();
      currentBookKey = null;
      showLoadingState();

      try {
        const buffer = await file.arrayBuffer();

        if (seq !== loadSeq) {
          return;
        }

        await putBook(bookKey, buffer);

        if (seq !== loadSeq) {
          return;
        }

        const text = decodeText(buffer);
        const now = Date.now();
        const meta = {
          bookKey,
          name: file.name,
          size: file.size,
          chars: text.length,
          addedAt: now,
          lastReadAt: now,
        };

        await putBookMeta(bookKey, meta);
        await renderShelf();
        updateStorageUsage();

        if (seq !== loadSeq) {
          return;
        }

        readingContent.textContent = text;
        currentBookKey = bookKey;
        saveSetting(LAST_BOOK_KEY, bookKey);
        showReaderView();
        window.scrollTo(0, 0);
        restoreReadingProgress(bookKey, seq);
      } catch (error) {
        if (seq !== loadSeq) {
          return;
        }

        readingContent.textContent = "文件读取或存储失败，请重新选择。";
        console.error(error);
      } finally {
        if (seq === loadSeq) {
          clearLoadingState();
          fileInput.value = "";
        }
      }
    });

    async function initializeReader() {
      history.replaceState({ view: "shelf" }, "");

      const startingLoadSeq = loadSeq;
      await renderShelf();

      if (loadSeq === startingLoadSeq) {
        openLastBook();
      }

      updateStorageUsage();
    }

    initializeReader();
  </script>
</body>
</html>
