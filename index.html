<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小说阅读器</title>
  <style>
    :root {
      --font-size: 18px;
      --bg: #f5f2eb;
      --fg: #292929;
    }

    :root.dark {
      --font-size: 18px;
      --bg: #181a1c;
      --fg: #e8e3d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--fg);
      background: var(--bg);
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 16px;
      padding: 16px;
    }

    .font-size-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--fg);
    }

    .font-size-slider {
      width: min(180px, 45vw);
      accent-color: #3f6f5e;
      cursor: pointer;
    }

    .file-button,
    .theme-button {
      min-height: 44px;
      padding: 10px 24px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }

    .file-button {
      color: #fff;
      background: #3f6f5e;
    }

    .theme-button {
      color: var(--bg);
      background: var(--fg);
    }

    .file-button:active,
    .theme-button:active {
      opacity: 0.8;
    }

    .file-button:active {
      background: #31594b;
    }

    .file-button:focus-visible,
    .theme-button:focus-visible {
      outline: 3px solid rgba(63, 111, 94, 0.35);
      outline-offset: 3px;
    }

    .reading-content {
      max-width: 720px;
      min-height: 60vh;
      margin: 0 auto;
      padding: 24px 32px 64px;
      border-radius: 8px;
      color: var(--fg);
      background: var(--bg);
      box-shadow: 0 4px 24px rgba(50, 40, 20, 0.08);
      font-size: var(--font-size);
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .reading-content:empty::before {
      content: "请选择一个 TXT 文件开始阅读";
      color: var(--fg);
      opacity: 0.55;
    }

    @media (max-width: 600px) {
      .toolbar {
        padding: 12px;
      }

      .reading-content {
        padding: 20px 16px 48px;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <input
      id="file-input"
      type="file"
      accept=".txt,text/plain"
      hidden
    >
    <button id="select-file" class="file-button" type="button">
      选择文件
    </button>
    <label class="font-size-control" for="font-size">
      字号
      <input
        id="font-size"
        class="font-size-slider"
        type="range"
        min="14"
        max="28"
        step="1"
        value="18"
      >
    </label>
    <button id="theme-toggle" class="theme-button" type="button">
      切换夜间模式
    </button>
  </div>

  <div id="reading-content" class="reading-content"></div>

  <script>
    const fileInput = document.getElementById("file-input");
    const selectButton = document.getElementById("select-file");
    const readingContent = document.getElementById("reading-content");
    const fontSizeInput = document.getElementById("font-size");
    const themeToggle = document.getElementById("theme-toggle");
    const root = document.documentElement;

    function decodeText(buffer) {
      try {
        return new TextDecoder("utf-8", { fatal: true }).decode(buffer);
      } catch {
        return new TextDecoder("gbk").decode(buffer);
      }
    }

    selectButton.addEventListener("click", () => {
      fileInput.click();
    });

    fontSizeInput.addEventListener("input", () => {
      root.style.setProperty("--font-size", `${fontSizeInput.value}px`);
    });

    themeToggle.addEventListener("click", () => {
      root.classList.toggle("dark");
    });

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      try {
        const buffer = await file.arrayBuffer();
        const text = decodeText(buffer);
        readingContent.textContent = text;
      } catch (error) {
        readingContent.textContent = "文件读取失败，请重新选择。";
        console.error(error);
      } finally {
        fileInput.value = "";
      }
    });
  </script>
</body>
</html>
