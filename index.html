<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小说阅读器</title>
  <script>
    (() => {
      try {
        const savedFontSize = Number(localStorage.getItem("reader.fontSize"));

        if (
          Number.isInteger(savedFontSize) &&
          savedFontSize >= 14 &&
          savedFontSize <= 28
        ) {
          document.documentElement.style.setProperty(
            "--font-size",
            `${savedFontSize}px`
          );
        }

        if (localStorage.getItem("reader.theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {
        console.error(error);
      }
    })();
  </script>
  <style>
    :root {
      --font-size: 18px;
      --bg: #f5f2eb;
      --fg: #292929;
    }

    :root.dark {
      --bg: #181a1c;
      --fg: #e8e3d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--fg);
      background: var(--bg);
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 16px;
      padding: 16px;
      background: var(--bg);
      border-bottom: 1px solid rgba(128, 128, 128, 0.2);
    }

    .font-size-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--fg);
    }

    .font-size-slider {
      width: min(180px, 45vw);
      accent-color: #3f6f5e;
      cursor: pointer;
    }

    .file-button,
    .theme-button {
      min-height: 44px;
      padding: 10px 24px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }

    .file-button {
      color: #fff;
      background: #3f6f5e;
    }

    .theme-button {
      color: var(--bg);
      background: var(--fg);
    }

    .file-button:active,
    .theme-button:active {
      opacity: 0.8;
    }

    .file-button:active {
      background: #31594b;
    }

    .file-button:focus-visible,
    .theme-button:focus-visible {
      outline: 3px solid rgba(63, 111, 94, 0.35);
      outline-offset: 3px;
    }

    .reading-content {
      max-width: 720px;
      min-height: 60vh;
      margin: 0 auto;
      padding: 24px 32px 64px;
      border-radius: 8px;
      color: var(--fg);
      background: var(--bg);
      box-shadow: 0 4px 24px rgba(50, 40, 20, 0.08);
      font-size: var(--font-size);
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    :root.dark .reading-content {
      box-shadow: none;
    }

    .reading-content:empty::before {
      content: "请选择一个 TXT 文件开始阅读";
      color: var(--fg);
      opacity: 0.55;
    }

    .reading-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      padding: 8px 16px;
      border-radius: 999px;
      color: var(--bg);
      background: var(--fg);
      font-size: 14px;
      line-height: 1.5;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .reading-toast.show {
      opacity: 0.92;
      transform: translate(-50%, 0);
    }

    .storage-usage {
      position: fixed;
      right: 12px;
      bottom: max(8px, env(safe-area-inset-bottom));
      z-index: 8;
      padding: 3px 6px;
      border-radius: 4px;
      color: var(--fg);
      background: var(--bg);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      line-height: 1.4;
      white-space: nowrap;
      opacity: 0.72;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .toolbar {
        padding: 12px;
      }

      .reading-content {
        padding: 20px 16px 48px;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <input
      id="file-input"
      type="file"
      accept=".txt,.md,text/plain"
      hidden
    >
    <button id="select-file" class="file-button" type="button">
      选择文件
    </button>
    <label class="font-size-control" for="font-size">
      字号
      <input
        id="font-size"
        class="font-size-slider"
        type="range"
        min="14"
        max="28"
        step="1"
        value="18"
      >
    </label>
    <button id="theme-toggle" class="theme-button" type="button">
      切换夜间模式
    </button>
  </div>

  <div id="reading-content" class="reading-content"></div>
  <div
    id="reading-toast"
    class="reading-toast"
    role="status"
    aria-live="polite"
  ></div>
  <div
    id="storage-usage"
    class="storage-usage"
    aria-live="polite"
    hidden
  ></div>

  <script>
    const fileInput = document.getElementById("file-input");
    const selectButton = document.getElementById("select-file");
    const readingContent = document.getElementById("reading-content");
    const fontSizeInput = document.getElementById("font-size");
    const themeToggle = document.getElementById("theme-toggle");
    const readingToast = document.getElementById("reading-toast");
    const storageUsage = document.getElementById("storage-usage");
    const root = document.documentElement;
    let currentBookKey = null;
    let progressSaveTimer = null;
    let toastTimer = null;
    let loadSeq = 0;

    const DB_NAME = "reader";
    const DB_VERSION = 1;
    const BOOK_STORE = "books";
    const LAST_BOOK_KEY = "reader.lastBookKey";

    // 不同域名 = 不同的 IndexedDB 数据库。
    let dbPromise = null;

    function openDB() {
      if (dbPromise !== null) {
        return dbPromise;
      }

      dbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = () => {
          const db = request.result;

          if (!db.objectStoreNames.contains(BOOK_STORE)) {
            db.createObjectStore(BOOK_STORE);
          }
        };

        request.onsuccess = () => {
          const db = request.result;

          db.onversionchange = () => {
            db.close();
            dbPromise = null;
          };

          resolve(db);
        };

        request.onerror = () => {
          dbPromise = null;
          reject(request.error);
        };
      });

      return dbPromise;
    }

    async function putBook(bookKey, buffer) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(BOOK_STORE, "readwrite");

        transaction.objectStore(BOOK_STORE).put(buffer, bookKey);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    async function getBook(bookKey) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(BOOK_STORE, "readonly");
        const request = transaction.objectStore(BOOK_STORE).get(bookKey);

        request.onsuccess = () => resolve(request.result ?? null);
        request.onerror = () => reject(request.error);
      });
    }

    async function deleteBook(bookKey) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(BOOK_STORE, "readwrite");

        transaction.objectStore(BOOK_STORE).delete(bookKey);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    function saveSetting(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (error) {
        console.error(error);
      }
    }

    function removeSetting(key) {
      try {
        localStorage.removeItem(key);
      } catch (error) {
        console.error(error);
      }
    }

    function showLoadingState() {
      readingContent.setAttribute("aria-busy", "true");
      readingContent.textContent = "正在载入……";
    }

    function clearLoadingState() {
      readingContent.removeAttribute("aria-busy");
    }

    async function updateStorageUsage() {
      if (!navigator.storage?.estimate) {
        return;
      }

      try {
        const { usage, quota } = await navigator.storage.estimate();
        const usedMB = (Number(usage) || 0) / (1024 * 1024);
        const quotaGB = (Number(quota) || 0) / (1024 * 1024 * 1024);

        storageUsage.textContent =
          `已用 ${usedMB.toFixed(2)} MB · 上限 ${quotaGB.toFixed(2)}GB`;
        storageUsage.hidden = false;
      } catch (error) {
        console.error(error);
      }
    }

    function getSavedFontSize() {
      try {
        const value = Number(localStorage.getItem("reader.fontSize"));
        return Number.isInteger(value) && value >= 14 && value <= 28
          ? value
          : null;
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    const savedFontSize = getSavedFontSize();

    if (savedFontSize !== null) {
      fontSizeInput.value = String(savedFontSize);
    }

    function getScrollElement() {
      return document.scrollingElement || document.documentElement;
    }

    function getProgressKey(bookKey) {
      return `reader.progress:${bookKey}`;
    }

    function getSavedProgress(bookKey) {
      try {
        const savedValue = localStorage.getItem(getProgressKey(bookKey));

        if (savedValue === null) {
          return null;
        }

        const progress = Number(savedValue);
        return Number.isFinite(progress) && progress >= 0 && progress <= 1
          ? progress
          : null;
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    function showReadingToast() {
      readingToast.textContent = "已回到上次阅读位置";
      readingToast.classList.add("show");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        readingToast.classList.remove("show");
      }, 2000);
    }

    function restoreReadingProgress(bookKey, seq) {
      const savedProgress = getSavedProgress(bookKey);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (seq !== loadSeq) {
            return;
          }

          const scrollElement = getScrollElement();
          const maxScroll = scrollElement.scrollHeight - window.innerHeight;
          const progress = savedProgress ?? 0;

          scrollElement.scrollTop = maxScroll > 0 ? progress * maxScroll : 0;

          if (savedProgress !== null && savedProgress > 0) {
            showReadingToast();
          }
        });
      });
    }

    function saveReadingProgress() {
      if (currentBookKey === null) {
        return;
      }

      const scrollElement = getScrollElement();
      const maxScroll = scrollElement.scrollHeight - window.innerHeight;
      const progress =
        maxScroll > 0 ? scrollElement.scrollTop / maxScroll : 0;

      saveSetting(getProgressKey(currentBookKey), String(progress));
    }

    function detectUtf16Encoding(bytes) {
      const sampleLength = Math.min(bytes.length, 4096);
      let evenZeros = 0;
      let oddZeros = 0;
      let pairs = 0;

      for (let index = 0; index + 1 < sampleLength; index += 2) {
        if (bytes[index] === 0) {
          evenZeros++;
        }

        if (bytes[index + 1] === 0) {
          oddZeros++;
        }

        pairs++;
      }

      if (pairs < 4) {
        return null;
      }

      const evenRatio = evenZeros / pairs;
      const oddRatio = oddZeros / pairs;

      if (oddRatio >= 0.2 && oddRatio > evenRatio * 3) {
        return "utf-16le";
      }

      if (evenRatio >= 0.2 && evenRatio > oddRatio * 3) {
        return "utf-16be";
      }

      return null;
    }

    function decodeText(buffer) {
      const bytes = new Uint8Array(buffer);

      if (
        bytes[0] === 0xef &&
        bytes[1] === 0xbb &&
        bytes[2] === 0xbf
      ) {
        return new TextDecoder("utf-8").decode(bytes.subarray(3));
      }

      if (bytes[0] === 0xff && bytes[1] === 0xfe) {
        return new TextDecoder("utf-16le").decode(bytes.subarray(2));
      }

      if (bytes[0] === 0xfe && bytes[1] === 0xff) {
        return new TextDecoder("utf-16be").decode(bytes.subarray(2));
      }

      const utf16Encoding = detectUtf16Encoding(bytes);

      if (utf16Encoding !== null) {
        return new TextDecoder(utf16Encoding).decode(bytes);
      }

      try {
        return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      } catch {
        return new TextDecoder("gbk").decode(bytes);
      }
    }

    async function openLastBook() {
      let lastBookKey = null;

      try {
        lastBookKey = localStorage.getItem(LAST_BOOK_KEY);
      } catch (error) {
        console.error(error);
      }

      if (!lastBookKey) {
        return;
      }

      const seq = ++loadSeq;
      showLoadingState();

      try {
        const buffer = await getBook(lastBookKey);

        if (seq !== loadSeq) {
          return;
        }

        if (buffer === null) {
          removeSetting(LAST_BOOK_KEY);
          readingContent.textContent = "";
          return;
        }

        const text = decodeText(buffer);
        readingContent.textContent = text;
        currentBookKey = lastBookKey;
        restoreReadingProgress(lastBookKey, seq);
      } catch (error) {
        if (seq !== loadSeq) {
          return;
        }

        readingContent.textContent = "载入失败，请重新选择文件。";
        console.error(error);
      } finally {
        if (seq === loadSeq) {
          clearLoadingState();
        }
      }
    }

    selectButton.addEventListener("click", () => {
      fileInput.click();
    });

    fontSizeInput.addEventListener("input", () => {
      root.style.setProperty("--font-size", `${fontSizeInput.value}px`);
      saveSetting("reader.fontSize", fontSizeInput.value);
    });

    themeToggle.addEventListener("click", () => {
      const isDark = root.classList.toggle("dark");
      saveSetting("reader.theme", isDark ? "dark" : "light");
    });

    window.addEventListener(
      "scroll",
      () => {
        clearTimeout(progressSaveTimer);
        progressSaveTimer = setTimeout(() => {
          saveReadingProgress();
        }, 200);
      },
      { passive: true }
    );

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      const seq = ++loadSeq;
      const bookKey = `${file.name}::${file.size}`;

      clearTimeout(progressSaveTimer);
      saveReadingProgress();
      currentBookKey = null;
      showLoadingState();

      try {
        const buffer = await file.arrayBuffer();

        if (seq !== loadSeq) {
          return;
        }

        await putBook(bookKey, buffer);
        updateStorageUsage();

        if (seq !== loadSeq) {
          return;
        }

        const text = decodeText(buffer);
        readingContent.textContent = text;
        currentBookKey = bookKey;
        saveSetting(LAST_BOOK_KEY, bookKey);
        restoreReadingProgress(bookKey, seq);
      } catch (error) {
        if (seq !== loadSeq) {
          return;
        }

        readingContent.textContent = "文件读取或存储失败，请重新选择。";
        console.error(error);
      } finally {
        if (seq === loadSeq) {
          clearLoadingState();
          fileInput.value = "";
        }
      }
    });

    openLastBook();
    updateStorageUsage();
  </script>
</body>
</html>
