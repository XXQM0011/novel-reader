<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小说阅读器</title>
  <script>
    (() => {
      try {
        const savedFontSize = Number(localStorage.getItem("reader.fontSize"));

        if (
          Number.isInteger(savedFontSize) &&
          savedFontSize >= 14 &&
          savedFontSize <= 28
        ) {
          document.documentElement.style.setProperty(
            "--font-size",
            `${savedFontSize}px`
          );
          // 书页专用变量，会穿透 Shadow DOM。
          document.documentElement.style.setProperty(
            "--reader-font-size",
            `${savedFontSize}px`
          );
        }

        const isDark = localStorage.getItem("reader.theme") === "dark";

        if (isDark) {
          document.documentElement.classList.add("dark");
        }

        document.documentElement.style.setProperty(
          "--reader-color",
          isDark ? "#d8d8d8" : "#2b2b2b"
        );
      } catch (error) {
        console.error(error);
      }
    })();
  </script>
  <style>
    :root {
      /* 阅读字号：用户可调，保留原变量名 */
      --font-size: 18px;

      /* 间距阶梯 */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;

      /* 字号阶梯 */
      --text-xs: 12px;
      --text-sm: 13px;
      --text-base: 15px;
      --text-lg: 17px;
      --text-xl: 22px;

      /* 行高 */
      --leading-tight: 1.35;
      --leading-normal: 1.6;
      --leading-reading: 1.8;

      /* 圆角 */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;

      /* 动效 */
      --dur-fast: 120ms;
      --dur-base: 180ms;
      --ease: cubic-bezier(.2,.7,.3,1);

      /* 表面层级（浅色） */
      --surface-0: #f5f2eb;
      --surface-1: #fffdf9;
      --surface-2: #efe9df;
      --border-subtle: rgba(60,48,30,.12);
      --border-strong: rgba(60,48,30,.22);

      /* 文字层级（浅色） */
      --text-primary: #292929;
      --text-secondary: #6b6259;
      --text-muted: #958c81;

      /* 主色 */
      --accent: #3f6f5e;
      --accent-strong: #2f5b4c;
      --accent-contrast: #ffffff;
      --focus-ring: rgba(63,111,94,.35);

      /* 兼容旧变量名：其余 280 行 CSS 一行不用改 */
      --bg: var(--surface-0);
      --fg: var(--text-primary);
    }

    :root.dark {
      --surface-0: #181a1c;
      --surface-1: #202326;
      --surface-2: #282c30;
      --border-subtle: rgba(255,255,255,.10);
      --border-strong: rgba(255,255,255,.18);

      --text-primary: #e8e3d8;
      --text-secondary: #a9a196;
      --text-muted: #7d766c;

      --accent: #4f9b7f;
      --accent-strong: #3f8069;
      --accent-contrast: #0e1311;
      --focus-ring: rgba(79,155,127,.45);
    }
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--fg);
      background: var(--bg);
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* 书架视图下两个正文容器都要藏起来，否则 epub 正文会露在书架下方。 */
    body[data-view="shelf"] #reading-content,
    body[data-view="shelf"] #epub-content {
      display: none;
    }

    body[data-view="reader"] #shelf {
      display: none;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2) var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: var(--surface-1);
      border-bottom: 1px solid var(--border-subtle);
    }

     .font-size-control {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-left: auto; /* 把字号和它右边的控件一起推到右边 */
      color: var(--text-secondary);
      font-size: var(--text-sm);
    }

    .font-size-slider {
      width: min(140px, 40vw);
      accent-color: var(--accent);
      cursor: pointer;
    }
    file-button,
    .theme-button,
    .back-button {
      min-height: 36px;
      padding: var(--space-2) var(--space-4);
      border: 0;
      border-radius: var(--radius-sm);
      font: inherit;
      font-size: var(--text-sm);
      cursor: pointer;
      transition:
        background var(--dur-fast) var(--ease),
        border-color var(--dur-fast) var(--ease),
        opacity var(--dur-fast) var(--ease);
    }

    .file-button {
      color: var(--accent-contrast);
      background: var(--accent);
    }

    .file-button:hover {
      background: var(--accent-strong);
    }

    .theme-button {
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border-subtle);
    }

    .theme-button:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .back-button {
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border-subtle);
    }

    .back-button:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .file-button:active,
    .theme-button:active,
    .back-button:active {
      opacity: 0.8;
    }

    .file-button:active {
      opacity: 0.85;
      background: var(--accent-strong);
    }

    .file-button:focus-visible,
    .theme-button:focus-visible,
    .back-button:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

  .reading-content {
    max-width: 720px;
    min-height: 60vh;
    margin: 0 auto;
    padding: 48px 40px 96px;
    border-radius: 12px;
    color: var(--text-primary);
    background: var(--surface-1);
    box-shadow: 0 4px 24px rgba(50, 40, 20, 0.08);
    font-size: var(--font-size);
    line-height: 1.9;
    letter-spacing: 0.01em;
    white-space: normal;
    overflow-wrap: anywhere;
    text-align: justify;
  } 
  .reading-content p {
  margin: 0 0 0.7em;
  text-indent: 2em;
  text-align: justify;
  }

.reading-content p:last-child {
  margin-bottom: 0;
  }

    :root.dark .reading-content {
      box-shadow: none;
    }

    /* epub 章节渲染容器。里面是 Shadow DOM，样式由 renderChapter 提供。 */
    .epub-content {
      max-width: 720px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .epub-content[hidden] {
      display: none;
    }

    .epub-content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .image-missing {
      color: var(--text-muted);
      font-size: var(--text-sm);
      font-style: italic;
    }

    .reading-content:empty::before {
      content: "请选择一个 TXT 文件开始阅读";
      color: var(--fg);
      opacity: 0.55;
    }

    /* 空章节（封面页、版权页）的占位段落。
       用 .reading-content p.chapter-blank 提高权重，压过 .reading-content p
       的 text-align: justify 和 text-indent: 2em。 */
    .reading-content p.chapter-blank {
      color: var(--text-muted);
      opacity: 0.6;
      font-style: italic;
      text-align: center;
      text-indent: 0;
    }

    .loading {
      max-width: 720px;
      margin: 20px auto 0;
      padding: 0 32px;
      color: var(--fg);
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
      opacity: 0.55;
    }

    #loading:not([hidden]) + #reading-content:empty::before {
      content: none;
    }

    .shelf {
      max-width: 720px;
      margin: 20px auto 0;
      padding: 0 32px;
    }

     .shelf-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: var(--space-3);
    }

    .shelf-item {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-1) var(--space-3);
      width: 100%;
      padding: var(--space-3) var(--space-4) var(--space-3) var(--space-3);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      background: var(--surface-1);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition:
        transform var(--dur-fast) var(--ease),
        border-color var(--dur-fast) var(--ease),
        box-shadow var(--dur-fast) var(--ease);
    }

    .shelf-item:hover {
      transform: translateY(-1px);
      border-color: var(--border-strong);
      box-shadow: 0 6px 18px rgba(50, 40, 20, 0.08);
    }

    .shelf-item:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .shelf-cover {
      flex: none;
      display: grid;
      place-items: center;
      width: 40px;
      height: 54px;
      border-radius: var(--radius-sm);
      color: #fff;
      background: hsl(var(--cover-hue, 160) 32% 38%);
      font-size: var(--text-lg);
      font-weight: 500;
      line-height: 1;
    }

    :root.dark .shelf-cover {
      background: hsl(var(--cover-hue, 160) 28% 26%);
      color: #e8e3d8;
    }

    /* 封面是图片时填满整块，不拉伸变形。 */
    img.shelf-cover {
      object-fit: cover;
      display: block;
    }

    .shelf-title {
      min-width: 0;
      flex: 1 1 120px;
      overflow: hidden;
      font-size: var(--text-sm);
      line-height: var(--leading-tight);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shelf-chars {
      flex: none;
      font-size: var(--text-xs);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .shelf-progress {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-xs);
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .shelf-progress::before {
      content: "";
      width: 44px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(
        to right,
        var(--accent) var(--p, 0%),
        var(--surface-2) var(--p, 0%)
      );
    }

    .shelf-delete {
      position: absolute;
      top: var(--space-1);
      right: var(--space-1);
      min-width: 28px;
      min-height: 24px;
      padding: 2px var(--space-2);
      border: 0;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      background: transparent;
      font: inherit;
      font-size: var(--text-xs);
      cursor: pointer;
      opacity: 0.5;
      transition: opacity var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
    }

    .shelf-item:hover .shelf-delete,
    .shelf-item:focus-within .shelf-delete {
      opacity: 1;
    }

    .shelf-delete:hover {
      color: var(--text-primary);
      background: var(--surface-2);
    }

    .shelf-delete:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }
    
    .shelf-list {
      grid-template-columns: 1fr;
    }

    /* 触屏没有 hover，删除按钮必须常亮 */
    @media (hover: none) {
      .shelf-delete {
        opacity: 1;
      }
    }

    .shelf-empty {
      margin: 0;
      padding: var(--space-5) var(--space-4);
      border: 1px dashed var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-size: var(--text-sm);
      line-height: var(--leading-normal);
      text-align: center;
    }

    /* 目录面板：默认滑出屏幕外，靠 .is-open 滑入。
       hidden 不用 display:none，否则 transition 不会播放；
       改用 visibility 让它在关闭态真正不可见、不进可访问性树。 */
    .toc-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 20; /* 必须高于 .toolbar 的 10 */
      display: flex;
      flex-direction: column;
      width: min(320px, 85vw);
      background: var(--surface-1);
      border-left: 1px solid var(--border-subtle);
      transform: translateX(100%);
      visibility: hidden;
      transition:
        transform 180ms var(--ease),
        visibility 0s linear 180ms;
      pointer-events: none;
    }

    .toc-panel.is-open {
      transform: translateX(0);
      visibility: visible;
      transition:
        transform 180ms var(--ease),
        visibility 0s;
      pointer-events: auto;
    }

    .toc-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-subtle);
    }

    .toc-heading {
      color: var(--text-secondary);
      font-size: var(--text-sm);
      font-weight: 500;
    }

    .toc-close {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      background: transparent;
      font: inherit;
      font-size: var(--text-lg);
      line-height: 1;
      cursor: pointer;
    }

    .toc-close:hover {
      color: var(--text-primary);
      background: var(--surface-2);
    }

    .toc-close:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .toc-list {
      flex: 1;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
      -webkit-overflow-scrolling: touch;
    }

    .toc-item {
      width: 100%;
      padding: 10px 16px;
      border: 0;
      background: transparent;
      color: var(--text-primary);
      font: inherit;
      font-size: var(--text-sm);
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .toc-item:hover {
      background: var(--surface-2);
    }

    .toc-item.is-current {
      color: var(--accent);
      font-weight: 600;
    }

    .toc-item:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: -3px;
    }

    .toc-index {
      margin-right: 8px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .chapter-nav {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 40px 96px;
      display: flex;
      gap: var(--space-3);
    }

    /* hidden 属性自带的 display:none 优先级低于上面的 display:flex，
       不显式声明的话导航条会一直占着高度露在书架上。 */
    .chapter-nav[hidden] {
      display: none;
    }

    .chapter-nav-button {
      flex: 1;
      min-height: 44px;
      padding: var(--space-2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: var(--surface-1);
      color: var(--text-primary);
      font: inherit;
      font-size: var(--text-sm);
      cursor: pointer;
    }

    .chapter-nav-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .chapter-nav-button:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .reading-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      padding: 8px 16px;
      border-radius: 999px;
      color: var(--bg);
      background: var(--fg);
      font-size: 14px;
      line-height: 1.5;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .reading-toast.show {
      opacity: 0.92;
      transform: translate(-50%, 0);
    }

    .storage-usage {
      position: fixed;
      right: 12px;
      bottom: max(8px, env(safe-area-inset-bottom));
      z-index: 8;
      padding: 3px 6px;
      border-radius: 4px;
      color: var(--fg);
      background: var(--bg);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      line-height: 1.4;
      white-space: nowrap;
      opacity: 0.72;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .toolbar {
        padding: var(--space-2) var(--space-3);
        gap: var(--space-2);
      }

      .font-size-slider {
        width: 90px;
      }

      .toc-panel {
        width: 100%;
      }

      .chapter-nav {
        padding: 0 16px 48px;
      }
    }

      .reading-content {
        padding: 20px 16px 48px;
        border-radius: 0;
        box-shadow: none;
      }

      .loading {
        padding: 0 16px;
      }

      .shelf {
        padding: 0 16px;
      }
    }
  </style>
</head>
<body data-view="shelf">
  <div class="toolbar">
    <input
      id="file-input"
      type="file"
      accept=".txt,.md,.epub,text/plain"
      hidden
    >
    <button id="select-file" class="file-button" type="button">
      选择文件
    </button>
    <button
      id="back-to-shelf"
      class="back-button"
      type="button"
      hidden
    >
      ← 书架
    </button>
    <button id="toc-button" class="theme-button" type="button" hidden>目录</button>
    <label class="font-size-control" for="font-size">
      字号
      <input
        id="font-size"
        class="font-size-slider"
        type="range"
        min="14"
        max="28"
        step="1"
        value="18"
      >
    </label>
    <button id="theme-toggle" class="theme-button" type="button">
      切换夜间模式
    </button>
  </div>

  <section id="shelf" class="shelf" aria-label="书架">
    <div id="shelf-list" class="shelf-list"></div>
    <p id="shelf-empty" class="shelf-empty" hidden>
      还没有书，点上面导入一本
    </p>
  </section>

  <div id="loading" class="loading" hidden>正在打开上次那本书…</div>
  <div id="reading-content" class="reading-content"></div>
  <div id="epub-content" class="epub-content" hidden></div>
  <div id="chapter-nav" class="chapter-nav" hidden>
    <button id="prev-chapter" class="chapter-nav-button" type="button">← 上一章</button>
    <button id="next-chapter" class="chapter-nav-button" type="button">下一章 →</button>
  </div>
  <aside id="toc-panel" class="toc-panel" hidden aria-label="章节目录">
    <div class="toc-head">
      <span class="toc-heading">目录</span>
      <button id="toc-close" class="toc-close" type="button" aria-label="关闭目录">×</button>
    </div>
    <ol id="toc-list" class="toc-list"></ol>
  </aside>
  <div
    id="reading-toast"
    class="reading-toast"
    role="status"
    aria-live="polite"
  ></div>
  <div
    id="storage-usage"
    class="storage-usage"
    aria-live="polite"
    hidden
  ></div>

  <script src="epub.js"></script>
  <script>
    const fileInput = document.getElementById("file-input");
    const selectButton = document.getElementById("select-file");
    const backToShelf = document.getElementById("back-to-shelf");
    const readingContent = document.getElementById("reading-content");
    const epubContent = document.getElementById("epub-content");
    const fontSizeInput = document.getElementById("font-size");
    const themeToggle = document.getElementById("theme-toggle");
    const readingToast = document.getElementById("reading-toast");
    const storageUsage = document.getElementById("storage-usage");
    const loading = document.getElementById("loading");
    const shelfList = document.getElementById("shelf-list");
    const shelfEmpty = document.getElementById("shelf-empty");
    const tocButton = document.getElementById("toc-button");
    const tocPanel = document.getElementById("toc-panel");
    const tocClose = document.getElementById("toc-close");
    const tocList = document.getElementById("toc-list");
    const chapterNav = document.getElementById("chapter-nav");
    const prevChapter = document.getElementById("prev-chapter");
    const nextChapter = document.getElementById("next-chapter");
    const root = document.documentElement;
    let currentBookKey = null;
    // 当前打开这本书的章节数组；epub 章节切换要用。
    let currentChapters = null;
    // 当前读到第几章；关 3 的章节切换要用。
    let currentChapterIndex = 0;
    // 当前这本书是不是 epub；决定目录入口是否可见。
    let currentBookIsEpub = false;
    // 正在离开阅读视图。history.back() 会让浏览器把 scrollY 重置成 0 并
    // 触发一次 scroll 事件，那次事件必须被忽略，否则会把正确位置冲成 0。
    let isLeavingReader = false;
    // 正在恢复上次位置。这期间的滚动都是中间态，一律不保存。
    let isRestoringPos = false;
    let progressSaveTimer = null;
    let toastTimer = null;
    let loadSeq = 0;
    // 书架封面的 objectURL 不会自己释放，每次重建 DOM 前必须全部 revoke。
    let shelfCoverUrls = [];
    // 当前章节里图片的 objectURL，切章时要统一回收。
    let chapterImageUrls = [];
    // buildScopedCss 同步阶段记下待解析的 CSS 资源路径，异步阶段再换成 blob URL。
    let pendingCssUrls = [];

    const DB_NAME = "reader";
    const DB_VERSION = 4;
    const BOOK_STORE = "books";
    const META_STORE = "meta";
    const CHAPTER_STORE = "chapters";
    const RESOURCE_STORE = "resources";
    const LAST_BOOK_KEY = "reader.lastBookKey";

    // 不同域名 = 不同的 IndexedDB 数据库。
    let dbPromise = null;

    function showShelfView() {
      document.body.dataset.view = "shelf";
      backToShelf.setAttribute("hidden", "");
      closeTocPanel();
      resetBookState();
      syncEpubUiVisibility();

      // 历史栈顶必须是 shelf，否则「返回书架」按钮会因为
      // history.state.view 还是 reader 而误判，点了没反应。
      if (history.state?.view !== "shelf") {
        history.replaceState({ view: "shelf" }, "");
      }
    }

    function applyReaderView() {
      document.body.dataset.view = "reader";
      backToShelf.removeAttribute("hidden");
    }

    // 回到书架时把当前书的状态清干净，避免上一本的章节残留到下一本。
    function resetBookState() {
      currentChapters = null;
      currentChapterIndex = 0;
      currentBookIsEpub = false;
      updateChapterNav();
    }

    // 目录入口和章节导航的显隐条件必须一致，统一在这里算。
    function syncEpubUiVisibility() {
      const isReaderView = document.body.dataset.view === "reader";
      const show = isReaderView && currentBookIsEpub;

      tocButton.hidden = !show;
      chapterNav.hidden = !show;
    }

    // 第一章禁用「上一章」，最后一章禁用「下一章」。
    function updateChapterNav() {
      const total = currentChapters ? currentChapters.length : 0;
      const hasChapters = total > 0;

      prevChapter.disabled = !hasChapters || currentChapterIndex <= 0;
      nextChapter.disabled = !hasChapters || currentChapterIndex >= total - 1;
    }

    function showReaderView() {
      const isEnteringReader = document.body.dataset.view !== "reader";

      applyReaderView();
      // 进入阅读视图，重新允许记录滚动位置。
      isLeavingReader = false;
      syncEpubUiVisibility();

      // 历史栈：
      // 初始 [shelf] -> 从书架打开书籍 [shelf, reader]
      // 返回或物理返回键 [shelf]；反向切换只出栈，绝不 push。
      if (isEnteringReader) {
        history.pushState({ view: "reader" }, "");
      }
    }

    function openDB() {
      if (dbPromise !== null) {
        return dbPromise;
      }

      dbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = () => {
          const db = request.result;

          if (!db.objectStoreNames.contains(BOOK_STORE)) {
            db.createObjectStore(BOOK_STORE);
          }

          if (!db.objectStoreNames.contains(META_STORE)) {
            db.createObjectStore(META_STORE);
          }

          if (!db.objectStoreNames.contains(CHAPTER_STORE)) {
            db.createObjectStore(CHAPTER_STORE);
          }

          if (!db.objectStoreNames.contains(RESOURCE_STORE)) {
            db.createObjectStore(RESOURCE_STORE);
          }
        };

        request.onsuccess = () => {
          const db = request.result;

          db.onversionchange = () => {
            db.close();
            dbPromise = null;
          };

          resolve(db);
        };

        request.onerror = () => {
          dbPromise = null;
          reject(request.error);
        };
      });

      return dbPromise;
    }

    async function putBook(bookKey, buffer) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(BOOK_STORE, "readwrite");

        transaction.objectStore(BOOK_STORE).put(buffer, bookKey);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    async function putBookMeta(bookKey, meta) {
      const db = await openDB();

      return new Promise((resolve, reject) => {

    async function putChapters(bookKey, chapters) {

    async function getChapters(bookKey) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(CHAPTER_STORE, "readonly");
        const request = transaction.objectStore(CHAPTER_STORE).get(bookKey);

        request.onsuccess = () => resolve(request.result ?? null);

    async function deleteChapters(bookKey) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(CHAPTER_STORE, "readwrite");

        transaction.objectStore(CHAPTER_STORE).delete(bookKey);

    // 资源 key：`${bookKey}::${path}`。bookKey 里已经有一个 ::，
    // 用 path 相对 opfDir（如 images/cover.jpg）拼在后面，不会和 / 冲突。
    function getResourceKey(bookKey, path) {
      return `${bookKey}::${path}`;
    }

    // 一次性写入全部图片。几十张图各开一个事务会明显变慢。
    // 一次性写入全部资源。几十条各开一个事务会明显变慢。
    // 同一套 key 里装两种东西：
    //   图片/字体 → { blob, mediaType }
    //   CSS 文本  → { text }
    // 语义上不够纯，但省掉一个 store（删书要清的地方也跟着少一处）。
    async function putResources(bookKey, resources) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(RESOURCE_STORE, "readwrite");
        const store = transaction.objectStore(RESOURCE_STORE);

        for (const resource of resources) {
          // 不存 bookKey / path，它们已经在 key 里了。
          const value =
            typeof resource.text === "string"
              ? { text: resource.text }
              : { blob: resource.blob, mediaType: resource.mediaType };

          store.put(value, getResourceKey(bookKey, resource.path));
        }

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    async function getResource(bookKey, path) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(RESOURCE_STORE, "readonly");
        const request = transaction
          .objectStore(RESOURCE_STORE)
          .get(getResourceKey(bookKey, path));

        request.onsuccess = () => resolve(request.result ?? null);
        request.onerror = () => reject(request.error);
      });
    }

    // 取出这本书存下的全部 CSS 记录（只有 { text } 那种，没有 blob）。
    // 返回 [{ path, text }]，path 相对 opfDir，供 url() 相对解析用。
    async function getStyleSheets(bookKey) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(RESOURCE_STORE, "readonly");
        const store = transaction.objectStore(RESOURCE_STORE);
        const keysRequest = store.getAllKeys();
        const valuesRequest = store.getAll();

        transaction.oncomplete = () => {
          const prefix = `${bookKey}::`;
          const sheets = [];

          keysRequest.result.forEach((key, index) => {
            const value = valuesRequest.result[index];

            if (
              typeof key === "string" &&
              key.startsWith(prefix) &&
              value &&
              typeof value.text === "string"
            ) {
              sheets.push({ path: key.slice(prefix.length), text: value.text });
            }
          });

          resolve(sheets);
        };
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    // IndexedDB 没有按前缀删的 API，只能拿到所有 key 再过滤。
    async function deleteResources(bookKey) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(RESOURCE_STORE, "readwrite");
        const store = transaction.objectStore(RESOURCE_STORE);
        const keysRequest = store.getAllKeys();

        keysRequest.onsuccess = () => {
          const prefix = `${bookKey}::`;

          for (const key of keysRequest.result) {
            if (typeof key === "string" && key.startsWith(prefix)) {
              store.delete(key);
            }
          }
        };
        keysRequest.onerror = () => reject(keysRequest.error);

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    function saveSetting(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (error) {
        console.error(error);
      }
    }

    function removeSetting(key) {

    async function updateStorageUsage() {
      if (!navigator.storage?.estimate) {
        return;
      }

      try {
        const { usage, quota } = await navigator.storage.estimate();
        const usedMB = (Number(usage) || 0) / (1024 * 1024);
        const quotaGB = (Number(quota) || 0) / (1024 * 1024 * 1024);

        storageUsage.textContent =
          `已用 ${usedMB.toFixed(2)} MB · 上限 ${quotaGB.toFixed(2)}GB`;
        storageUsage.hidden = false;
      } catch (error) {
        console.error(error);
      }
    }

    function getSavedFontSize() {
      try {
        const value = Number(localStorage.getItem("reader.fontSize"));
        return Number.isInteger(value) && value >= 14 && value <= 28
          ? value
          : null;
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    const savedFontSize = getSavedFontSize();

    if (savedFontSize !== null) {
      fontSizeInput.value = String(savedFontSize);
    }

    function getScrollElement() {
      return document.scrollingElement || document.documentElement;
    }

    function getPosKey(bookKey) {
      return `reader.pos:${bookKey}`;
    }

    // 旧模型：整本书的滚动比例，只有一个 0~1 的数字。
    function getLegacyProgressKey(bookKey) {
      return `reader.progress:${bookKey}`;
    }

    function isValidPos(pos) {
      return (
        pos !== null &&
        typeof pos === "object" &&
        Number.isFinite(pos.chapter) &&
        Number.isFinite(pos.ratio) &&
        pos.chapter >= 0 &&
        pos.ratio >= 0 &&
        // 旧版本滚到最底部会存出 1.00006 这种亚像素误差值，
        // 留一点容差，别把用户已有的进度判成非法。
        pos.ratio <= 1.01
      );
    }

    function getSavedPos(bookKey) {
      try {
        const savedValue = localStorage.getItem(getPosKey(bookKey));

        if (savedValue !== null) {
          try {
            const parsed = JSON.parse(savedValue);

            if (isValidPos(parsed)) {
              return { chapter: parsed.chapter, ratio: parsed.ratio };
            }
          } catch {
            // 新 key 内容坏了，往下走旧 key 兜底。
          }
        }

        const legacyValue = localStorage.getItem(getLegacyProgressKey(bookKey));

        if (legacyValue === null) {
          return null;
        }

        const legacyRatio = Number(legacyValue);

        if (!Number.isFinite(legacyRatio) || legacyRatio < 0 || legacyRatio > 1) {
          return null;
        }

        // 老用户的进度都在旧 key 里，直接换 key 等于静默清零，必须迁移。
        const migrated = { chapter: 0, ratio: legacyRatio };

        saveSetting(getPosKey(bookKey), JSON.stringify(migrated));
        removeSetting(getLegacyProgressKey(bookKey));

        return migrated;
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    // 释放上一轮书架封面的 objectURL；重建 DOM 前必须调用。
    function releaseShelfCoverUrls() {
      shelfCoverUrls.forEach((url) => URL.revokeObjectURL(url));
      shelfCoverUrls = [];
    }

    async function renderShelf() {
      try {
        // 书架只对 meta 调用 getAll；绝不能对 books 调用 getAll：
        // 会把所有正文一次性读进内存，20 本 5MB 的书就是 100MB。
        const metas = await getAllBookMeta();

        metas.sort(
          (first, second) =>
            (Number(second.lastReadAt) || 0) -
            (Number(first.lastReadAt) || 0)
        );

        releaseShelfCoverUrls();
        shelfList.replaceChildren();
        shelfEmpty.hidden = metas.length > 0;

        for (const meta of metas) {
          // 书名是用户可控内容，必须使用 createElement + textContent，禁止 innerHTML 拼接，避免 XSS。
          const item = document.createElement("div");
          const title = document.createElement("span");
          const chars = document.createElement("span");
          const progress = document.createElement("span");
          const deleteButton = document.createElement("button");
          const pos = getSavedPos(meta.bookKey);
          const chapterCount = Number(meta.chapterCount) || 1;
          const percent = pos
            ? (pos.chapter + pos.ratio) / chapterCount
            : 0;
          const charCount = Number(meta.chars) || 0;

          item.className = "shelf-item";
          item.tabIndex = 0;
          item.setAttribute("role", "button");

          title.className = "shelf-title";
          title.textContent = String(meta.name ?? "").replace(
            /\.(txt|epub)$/i,
            ""
          );

          chars.className = "shelf-chars";
          chars.textContent = `${charCount.toLocaleString("zh-CN")} 字`;

          progress.className = "shelf-progress";
          progress.textContent = `${Math.round(percent * 100)}%`;

          // 封面块：有封面图就用图片；否则退回书名首字 + 书名决定的色相。
          // 进度条比例通过 --p 传给 CSS。
          let cover;

          if (meta.cover instanceof Blob) {
            const coverUrl = URL.createObjectURL(meta.cover);

            shelfCoverUrls.push(coverUrl);

            cover = document.createElement("img");
            cover.className = "shelf-cover";
            cover.src = coverUrl;
            cover.alt = "";
            cover.loading = "lazy";
            cover.decoding = "async";
          } else {
            cover = document.createElement("div");
            cover.className = "shelf-cover";
            cover.textContent = title.textContent.slice(0, 1);
            cover.style.setProperty(
              "--cover-hue",
              String(bookHue(title.textContent))
            );
          }

          progress.style.setProperty("--p", progress.textContent);
          item.prepend(cover);

          deleteButton.type = "button";
          deleteButton.className = "shelf-delete";
          deleteButton.textContent = "删";
          deleteButton.setAttribute("aria-label", `删除 ${title.textContent}`);
          deleteButton.addEventListener("click", (event) => {
            event.stopPropagation();
            deleteShelfBook(meta.bookKey);
          });

          item.append(title, chars, progress, deleteButton);
          item.dataset.bookKey = String(meta.bookKey ?? "");
          shelfList.append(item);
        }
      } catch (error) {
        releaseShelfCoverUrls();
        shelfList.replaceChildren();
        shelfEmpty.hidden = false;
        console.error(error);
      }
    }

    async function openShelfBook(bookKey) {
      // 切换视图会隐藏正文并改变布局，必须在离开阅读视图前保存当前进度。
      // 只在阅读视图里存：从书架点开新书时视图已经是 shelf，
      // 此时保存会把上一本书的进度用 scrollY=0 覆盖掉。
      if (document.body.dataset.view === "reader") {
        saveReadingPos();
      }

      // 换书前先回收上一本的章节图片。
      releaseChapterImageUrls();

      clearTimeout(progressSaveTimer);

      const seq = ++loadSeq;
      currentBookKey = null;
      loading.hidden = true;
      showLoadingState();

      try {
        // 先看这本书的 format：老数据没有这个字段，一律按 txt 处理。
        const bookMetas = await getAllBookMeta();

        if (seq !== loadSeq) {
          return;
        }

        const bookMeta = bookMetas.find((meta) => meta.bookKey === bookKey);

        if (bookMeta?.format === "epub") {
          const chapters = await getChapters(bookKey);

          if (seq !== loadSeq) {
            return;
          }

          if (!chapters || chapters.length === 0) {
            throw new Error("章节数据丢失，请重新导入");
          }

          currentBookKey = bookKey;
          currentChapters = chapters;
          currentBookIsEpub = true;

          // 第一章可能是封面页/版权页（只有图片没有文字），
          // 自动跳到第一个有文字的章节，别停在一页空白上。
          const firstTextIndex = findFirstTextChapter(chapters);

          currentChapterIndex = firstTextIndex;
          await renderEpubChapter(chapters[firstTextIndex], bookKey);

          if (seq !== loadSeq) {
            return;
          }

          saveSetting(LAST_BOOK_KEY, bookKey);

          await putBookMeta(bookKey, {
            ...bookMeta,
            lastReadAt: Date.now(),
          });

          if (seq !== loadSeq) {
            return;
          }

          await renderShelf();

          if (seq !== loadSeq) {
            return;
          }

          showReaderView();
          syncEpubUiVisibility();
          updateChapterNav();
          window.scrollTo(0, 0);

          // 章节已经就绪，可以按「第几章 + 章内比例」恢复。
          await applySavedPos(bookKey, getSavedPos(bookKey), seq);
          return;
        }

        // 只读取当前这一本正文，不对 books 表执行 getAll。
        const buffer = await getBook(bookKey);

        if (seq !== loadSeq) {
          return;
        }

        if (buffer === null) {
          return;
        }

        currentBookKey = bookKey;
        currentChapters = null;
        currentChapterIndex = 0;
        currentBookIsEpub = false;

        const text = decodeText(buffer);
        setReadingText(text);
        saveSetting(LAST_BOOK_KEY, bookKey);

        const metas = await getAllBookMeta();

        if (seq !== loadSeq) {
          return;
        }

        const existingMeta = metas.find((meta) => meta.bookKey === bookKey);

        if (existingMeta) {
          await putBookMeta(bookKey, {
            ...existingMeta,
            lastReadAt: Date.now(),
          });

          if (seq !== loadSeq) {
            return;
          }

          await renderShelf();

          if (seq !== loadSeq) {
            return;
          }
        }

        // 正文在书架视图中是隐藏的，先切视图再让双层 rAF 计算并恢复滚动位置。
        showReaderView();
        syncEpubUiVisibility();
        window.scrollTo(0, 0);
        await applySavedPos(bookKey, getSavedPos(bookKey), seq);
      } catch (error) {
        if (seq !== loadSeq) {
          return;
        }

        readingContent.textContent = "载入失败，请重新选择文件。";
        console.error(error);
      } finally {
        if (seq === loadSeq) {
          clearLoadingState();
        }
      }
    }

    async function deleteShelfBook(bookKey) {
      if (!confirm("删掉这本书？正文和阅读进度都会没。")) {
        return;
      }

      try {
        await deleteBook(bookKey);

        await deleteBookMeta(bookKey);
        await deleteChapters(bookKey);
        await deleteResources(bookKey);

        // 新旧两种进度 key 都要清，否则删书后会留下孤儿进度。
        removeSetting(getPosKey(bookKey));
        removeSetting(getLegacyProgressKey(bookKey));

        if (localStorage.getItem(LAST_BOOK_KEY) === bookKey) {
          localStorage.removeItem(LAST_BOOK_KEY);
        }
      } catch (error) {
        console.error(error);
        showToast("删除失败，请稍后重试");
      } finally {
        await renderShelf();
      }
    }
    
  function setReadingText(text) {
  setContentMode("txt");
  // 从 epub 切到 txt 时，上一章图片的 blob URL 没人再用了，顺手回收。
  releaseChapterImageUrls();

  const fragment = document.createDocumentFragment();
  const paragraphs = String(text ?? "").split(/\r?\n/);

  for (const raw of paragraphs) {
    const line = raw.trim();

    if (!line) {
      continue;
    }

    const p = document.createElement("p");
    p.textContent = line;
    fragment.append(p);
  }

  // 封面页、版权页这类章节只有图片没有文字。若直接清空，
  // .reading-content:empty::before 会命中，弹出「请选择一个 TXT 文件
  // 开始阅读」，让人以为书没打开。插入占位段落说明情况。
  if (fragment.childNodes.length === 0) {
    const blank = document.createElement("p");

    blank.className = "chapter-blank";
    blank.textContent = "（本页没有文字内容）";
    fragment.append(blank);
  }

  readingContent.replaceChildren(fragment);
}

    // 正文容器二选一：txt 用 #reading-content，epub 用 #epub-content。
    function setContentMode(mode) {
      readingContent.hidden = mode !== "txt";
      epubContent.hidden = mode !== "epub";
    }

    // 回收上一章图片的 objectURL。
    // 用 length = 0 就地清空，不重新赋值：别处可能持有这个数组的引用。
    function releaseChapterImageUrls() {
      for (const url of chapterImageUrls) {
        URL.revokeObjectURL(url);
      }

      chapterImageUrls.length = 0;
    }

    // 把章节 HTML 里的图片路径换成当前页可用的 blob URL。
    async function hydrateImages(html, bookKey) {
      const doc = new DOMParser().parseFromString(
        `<body>${html}</body>`,
        "text/html"
      );
      const nodes = [
        ...doc.querySelectorAll("img[src]"),
        ...doc.querySelectorAll("image"),
      ];
      for (const node of nodes) {
        const isSvgImage = node.tagName.toLowerCase() === "image";
        const path = isSvgImage
          ? (node.getAttribute("xlink:href") ?? node.getAttribute("href"))
          : node.getAttribute("src");
        if (!path || /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(path)) continue;

        const asset = await getResource(bookKey, path);
        if (!asset) {
          // 图片缺失不要抛错，整章还要能读。换成一行说明文字。
          const placeholder = doc.createElement("span");
          placeholder.className = "image-missing";
          placeholder.textContent = "（插图缺失）";
          node.replaceWith(placeholder);
          continue;
        }
        const url = URL.createObjectURL(asset.blob);
        chapterImageUrls.push(url);
        if (isSvgImage) {
          node.setAttribute("xlink:href", url);
          node.setAttribute("href", url);
        } else {
          node.setAttribute("src", url);
          node.removeAttribute("srcset");
        }
      }
      return doc.body.innerHTML;
    }

    // 把书里的 CSS 拼成一段可注入 Shadow DOM 的样式。
    // 【关键】url() 里的路径是相对「CSS 文件自己」的位置解析的，
    // 不是相对 opfDir，也不是相对章节。styles/main.css 里的 ../images/a.png
    // 指的是 images/a.png（相对 opfDir），而不是章节目录下的路径。
    async function buildScopedCss(bookKey) {
      const sheets = await getStyleSheets(bookKey);

      if (sheets.length === 0) {
        return "";
      }

      // 逐张表分别解析 url()：每张表用自己的目录做基准。
      // 合并成一段再解析会丢掉「哪张表的路径」这个信息。
      const parts = [];

      for (const sheet of sheets) {
        const sheetDir = NovelEpub.dirnamePosix(sheet.path);

        parts.push(
          NovelEpub.scopeCss(sheet.text, (rawUrl) => {
            const raw = String(rawUrl ?? "").trim();

            if (!raw) {
              return raw;
            }

            // 外链、data: 原样保留。
            if (/^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(raw)) {
              return raw;
            }

            // 开头的 / 指 zip 根，其余相对 CSS 文件所在目录。
            const resolved = raw.startsWith("/")
              ? NovelEpub.joinPosix("", raw.replace(/^\/+/, ""))
              : NovelEpub.joinPosix(sheetDir, raw);

            // 同步阶段拿不到 IndexedDB，先记下待替换的路径。
            pendingCssUrls.push(resolved);
            return `__CSS_URL_${pendingCssUrls.length - 1}__`;
          })
        );
      }

      return parts.join("\n");
    }

    // 把 CSS 里的占位符换成真实的 blob URL。
    // 必须异步做：需要逐个查 IndexedDB 取资源。
    async function resolveCssUrls(cssText, bookKey) {
      const urls = pendingCssUrls.slice();
      pendingCssUrls.length = 0;

      let result = cssText;

      for (let index = 0; index < urls.length; index += 1) {
        const asset = await getResource(bookKey, urls[index]);
        const placeholder = `__CSS_URL_${index}__`;

        if (!asset || !asset.blob) {
          // 查不到就退回相对 opfDir 的原始路径，至少不会变成空 url()。
          result = result.split(placeholder).join(urls[index]);
          continue;
        }

        const url = URL.createObjectURL(asset.blob);
        chapterImageUrls.push(url);
        result = result.split(placeholder).join(url);
      }

      return result;
    }

    // 渲染一个 epub 章节到 #epub-content 的 Shadow DOM 里。
    async function renderEpubChapter(chapter, bookKey) {
      releaseChapterImageUrls();

      const html = await hydrateImages(chapter.html, bookKey);
      const scoped = await buildScopedCss(bookKey);
      const css = await resolveCssUrls(scoped, bookKey);

      setContentMode("epub");
      NovelEpub.renderChapter(epubContent, html, css);
      // 清掉 reading-content 里 txt 的残留，避免两套内容同时存在内存里
      readingContent.replaceChildren();
    }

     // 用书名算一个稳定的色相：同一本书永远同一种封面颜色，重启也不变。
    function bookHue(name) {
      let hue = 0;

      for (let i = 0; i < name.length; i += 1) {
        hue = (hue * 31 + name.charCodeAt(i)) % 360;
      }

      return hue;
    }

    // 书架条目由 renderShelf 动态创建，因此统一在列表上使用事件委托。
    shelfList.addEventListener("click", (event) => {

    // 找第一个有文字的章节；封面页、版权页这类只有图片的章节要跳过。
    // 全都没文字时退回第 0 章，让占位段落来说明情况。
    function findFirstTextChapter(chapters) {
      if (!chapters || chapters.length === 0) {
        return 0;
      }

      const index = chapters.findIndex(
        (chapter) => String(chapter?.text ?? "").trim().length > 0
      );

      return index < 0 ? 0 : index;
    }

    // 章节标题来自书籍内容，不可信，必须 createElement + textContent。
    function renderTocList() {
      if (!currentChapters || currentChapters.length === 0) {
        return;
      }

      const fragment = document.createDocumentFragment();

      currentChapters.forEach((chapter, index) => {
        const item = document.createElement("li");
        const button = document.createElement("button");
        const order = document.createElement("span");
        const label = document.createElement("span");

        button.type = "button";
        button.className = "toc-item";
        // dataset 只接受字符串，显式转换避免以后误传数字。
        button.dataset.index = String(index);

        if (index === currentChapterIndex) {
          button.classList.add("is-current");
        }

        order.className = "toc-index";
        order.textContent = String(index + 1);

        label.textContent = String(chapter?.title ?? "");

        button.append(order, label);
        item.append(button);
        fragment.append(item);
      });

      tocList.replaceChildren(fragment);
    }

    function openTocPanel() {
      renderTocList();
      tocPanel.removeAttribute("hidden");
      tocPanel.classList.add("is-open");
    }

    function closeTocPanel() {
      tocPanel.classList.remove("is-open");
      tocPanel.setAttribute("hidden", "");
    }

    async function openChapter(index, options = {}) {
      if (!currentChapters || currentChapters.length === 0) {
        return;
      }

      if (index < 0 || index >= currentChapters.length) {
        return;
      }

      currentChapterIndex = index;
      await renderEpubChapter(currentChapters[index], currentBookKey);

      // 新章必须回到顶部，否则会停在上一章的滚动位置。
      window.scrollTo(0, 0);

      // 只改类名，不重渲染整个列表。
      tocList.querySelectorAll(".toc-item.is-current").forEach((item) => {
        item.classList.remove("is-current");
      });

      const current = tocList.querySelector(
        `.toc-item[data-index="${index}"]`
      );

      if (current) {
        current.classList.add("is-current");
      }

      updateChapterNav();

      // 切章就存一次，否则切完章直接关页面会丢掉章号。
      // 恢复上次位置时传 save: false：那一刻滚动还在 0，存下去会把
      // 刚读到的 ratio 冲成 0，而正确的值要等滚动完成后再存。
      if (options.save !== false) {
        saveReadingPos();
      }
    }

    backToShelf.addEventListener("click", () => {

      saveReadingPos();
      clearTimeout(progressSaveTimer);

      // 从这里开始，任何 scroll 事件都是浏览器重置滚动位置造成的噪音。
      isLeavingReader = true;

      // 离开当前章节：这一章的图片 blob URL 不会再被用到。
      releaseChapterImageUrls();

      // 只有「当前确实在阅读视图，且历史栈顶也是 reader」时才能后退。
      // 否则 history.state 可能已经和界面脱节（例如刷新后 openLastBook
      // 推进了历史，随后界面又切回了书架），此时 history.back() 退不到书架，
      // 点击就会毫无反应。这种情况下直接切视图。
      if (
        document.body.dataset.view === "reader" &&
        history.state?.view === "reader"
      ) {
        history.back();
        return;
      }

      ++loadSeq;
      currentBookKey = null;
      showShelfView();
      renderShelf();
      window.scrollTo(0, 0);
      isLeavingReader = false;
    });

    window.addEventListener("popstate", (event) => {
      const target = event.state?.view === "reader" ? "reader" : "shelf";

      // 不能只看 body.dataset.view：后退后界面是 shelf，再前进时它仍然是 shelf，
      // 只看当前视图会误以为无须切换，导致历史指针与界面错位。
      if (target === "reader") {
        if (document.body.dataset.view !== "reader") {
          try {
            currentBookKey = localStorage.getItem(LAST_BOOK_KEY);
          } catch (error) {
            console.error(error);
            currentBookKey = null;
          }

          applyReaderView();
          // 回到阅读视图，重新允许记录滚动位置。
          isLeavingReader = false;
        }

        return;
      }

      // 这里刻意不保存进度：popstate 触发时浏览器已经把滚动位置还原成
      // 上一条历史记录的值（书架是 0），此时读 DOM 只会读到 0，反而把
      // 正确的位置冲掉。进度已由滚动监听（200ms 防抖）和点「返回书架」
      // 时在位置仍然有效的情况下存好了。

      // 离开当前章节：这一章的图片 blob URL 不会再被用到。
      releaseChapterImageUrls();

      clearTimeout(progressSaveTimer);

      ++loadSeq;
      currentBookKey = null;
      showShelfView();
      renderShelf();
      window.scrollTo(0, 0);
      isLeavingReader = false;
    });

    function showToast(message) {
      readingToast.textContent = message;
      readingToast.classList.add("show");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        readingToast.classList.remove("show");
      }, 2000);
    }

    function showReadingToast() {
      showToast("已回到上次阅读位置");
    }

    async function applySavedPos(bookKey, pos, seq) {
      if (pos === null) {
        return;
      }

      // 恢复期间禁止任何保存：这段时间里的滚动（包括 openShelfBook 里的
      // scrollTo(0,0)）都只是中间态，写下去会把正确位置冲成 0。
      isRestoringPos = true;

      try {
        // 顺序不能反：必须先换到目标章节，再按章内比例滚动。
        // 在旧的 DOM 上滚，滚的是上一章的高度，位置毫无意义。
        if (pos.chapter > 0 && currentBookIsEpub) {
          await openChapter(pos.chapter, { save: false });

          if (seq !== loadSeq) {
            return;
          }
        }

        await new Promise((resolve) => {
          let settled = false;
          const finish = () => {
            if (settled) {
              return;
            }

            settled = true;
            resolve();
          };

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (seq === loadSeq) {
                const scrollElement = getScrollElement();
                const maxScroll =
                  scrollElement.scrollHeight - window.innerHeight;
                // 夹到 [0, 1]：旧数据可能带亚像素误差（1.00006），
                // 直接乘会滚过界。
                const safeRatio = Math.min(1, Math.max(0, pos.ratio));

                scrollElement.scrollTop =
                  maxScroll > 0 ? safeRatio * maxScroll : 0;

                if (pos.ratio > 0) {
                  showReadingToast();
                }
              }

              finish();
            });
          });

          // 后台标签页里 rAF 可能不执行，必须兜底解除标志，
          // 否则之后所有保存都会被永久拦掉。
          setTimeout(finish, 600);
        });
      } finally {
        isRestoringPos = false;
      }
    }

    function saveReadingPos() {
      if (currentBookKey === null) {
        return;
      }

      // 恢复位置期间滚动还在中间态，不能写。
      if (isRestoringPos) {
        return;
      }

      // 书架视图下正文是 display:none，scrollHeight 塌缩，滚动位置也没意义。
      // 切视图时浏览器还会把 scrollY 重置成 0，若此时有排队中的防抖保存
      // 触发，就会把正确的位置覆盖成 0。
      if (document.body.dataset.view !== "reader") {
        return;
      }

      const scrollElement = getScrollElement();
      const maxScroll = scrollElement.scrollHeight - window.innerHeight;
      // 滚到最底部时 scrollTop 是亚像素值（如 6354.4 / 6354），
      // 算出来的 ratio 会略大于 1（1.00006）。不夹紧的话存进去的值
      // 过不了 isValidPos 的 <= 1 校验，读回来变成 null，进度就丢了。
      const ratio = maxScroll > 0
        ? Math.min(1, Math.max(0, scrollElement.scrollTop / maxScroll))
        : 0;

      // txt 书没有章节，currentChapterIndex 恒为 0。
      const pos = {
        chapter: currentChapterIndex,
        ratio,
      };

      saveSetting(getPosKey(currentBookKey), JSON.stringify(pos));
    }

    function detectUtf16Encoding(bytes) {
      const sampleLength = Math.min(bytes.length, 4096);
      let evenZeros = 0;
      let oddZeros = 0;
      let pairs = 0;

      for (let index = 0; index + 1 < sampleLength; index += 2) {
        if (bytes[index] === 0) {
          evenZeros++;
        }

        if (bytes[index + 1] === 0) {
          oddZeros++;
        }

        pairs++;
      }

      if (pairs < 4) {
        return null;
      }

      const evenRatio = evenZeros / pairs;
      const oddRatio = oddZeros / pairs;

      if (oddRatio >= 0.2 && oddRatio > evenRatio * 3) {
        return "utf-16le";
      }

      if (evenRatio >= 0.2 && evenRatio > oddRatio * 3) {
        return "utf-16be";
      }

      return null;
    }

    function replacementRatio(text) {
      let replacements = 0;
      let characters = 0;

      for (const character of text) {
        characters++;

        if (character === "\uFFFD") {
          replacements++;
        }
      }

      return characters === 0 ? 0 : replacements / characters;
    }

    // 二进制文件被当成文本解码后，会产出大量 NUL、控制字符、私用区字符和替换字符。
    // 正常文本里这些字符几乎不存在，比例过高就说明根本不是文本。
    // 必须在渲染前拦下来：几百万这种字符塞进 DOM 会让字体回退查找爆炸，页面直接卡死。
    function looksLikeBinaryText(text) {
      let suspicious = 0;
      let characters = 0;

      for (const character of text) {
        characters++;

        const code = character.codePointAt(0);

        if (
          code === 0 ||
          code === 0xfffd ||
          (code >= 0xe000 && code <= 0xf8ff) ||
          (code < 0x20 && code !== 0x09 && code !== 0x0a && code !== 0x0d)
        ) {
          suspicious++;
        }
      }

      return characters > 0 && suspicious / characters > 0.05;
    }

    function decodeTextRaw(buffer) {
      const bytes = new Uint8Array(buffer);

      if (
        bytes[0] === 0xef &&
        bytes[1] === 0xbb &&
        bytes[2] === 0xbf
      ) {
        return new TextDecoder("utf-8").decode(bytes.subarray(3));
      }

      if (bytes[0] === 0xff && bytes[1] === 0xfe) {
        return new TextDecoder("utf-16le").decode(bytes.subarray(2));
      }

      if (bytes[0] === 0xfe && bytes[1] === 0xff) {
        return new TextDecoder("utf-16be").decode(bytes.subarray(2));
      }

      const utf16Encoding = detectUtf16Encoding(bytes);

      if (utf16Encoding !== null) {
        return new TextDecoder(utf16Encoding).decode(bytes);
      }

      try {
        return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      } catch {
        // 严格解码失败只说明“不是纯 UTF-8”，不说明“不是 UTF-8”。
      }

      const utf8Text = new TextDecoder("utf-8").decode(bytes);

      if (replacementRatio(utf8Text) < 0.05) {
        return utf8Text;
      }

      let bestText = "";
      let bestRatio = Infinity;

      for (const encoding of ["gbk", "utf-16le", "utf-16be"]) {
        const text = new TextDecoder(encoding).decode(bytes);
        const ratio = replacementRatio(text);

        if (ratio < bestRatio) {
          bestText = text;
          bestRatio = ratio;
        }
      }

      return bestText;
    }

    // 所有解码分支都经过这里校验，避免漏掉某一条 return。
    function decodeText(buffer) {
      const text = decodeTextRaw(buffer);

      if (looksLikeBinaryText(text)) {
        throw new Error("文件内容不是文本，可能已损坏或格式不支持");
      }

      return text;
    }

    async function openLastBook() {
      let lastBookKey = null;

      try {
        lastBookKey = localStorage.getItem(LAST_BOOK_KEY);
      } catch (error) {
        console.error(error);
      }

      if (!lastBookKey) {
        return;
      }

      const seq = ++loadSeq;
      loading.hidden = false;

      // 打开新书前先回收上一本的章节图片。
      releaseChapterImageUrls();

      try {
        // epub 在 books 表里存的是压缩包原始字节，直接 decodeText 会得到乱码，
        // 所以必须先看 meta 的 format。
        const metas = await getAllBookMeta();

        if (seq !== loadSeq) {
          return;
        }

        const meta = metas.find((item) => item.bookKey === lastBookKey);

        if (meta?.format === "epub") {
          const chapters = await getChapters(lastBookKey);

          if (seq !== loadSeq) {
            return;
          }

          if (!chapters || chapters.length === 0) {
            removeSetting(LAST_BOOK_KEY);
            readingContent.textContent = "";
            return;
          }

          currentChapters = chapters;
          currentBookIsEpub = true;

          // 第一章可能是封面页/版权页，自动跳到第一个有文字的章节。
          const firstTextIndex = findFirstTextChapter(chapters);

          currentChapterIndex = firstTextIndex;
          currentBookKey = lastBookKey;
          await renderEpubChapter(chapters[firstTextIndex], lastBookKey);

          if (seq !== loadSeq) {
            return;
          }

          showReaderView();
          syncEpubUiVisibility();
          updateChapterNav();
          window.scrollTo(0, 0);

          // 章节已经就绪，可以按「第几章 + 章内比例」恢复。
          await applySavedPos(lastBookKey, getSavedPos(lastBookKey), seq);
          return;
        }

        const buffer = await getBook(lastBookKey);

        if (seq !== loadSeq) {
          return;
        }

        if (buffer === null) {
          removeSetting(LAST_BOOK_KEY);
          readingContent.textContent = "";
          return;
        }

        currentChapters = null;
        currentChapterIndex = 0;
        currentBookIsEpub = false;

        const text = decodeText(buffer);
        setReadingText(text);
        currentBookKey = lastBookKey;
        showReaderView();
        syncEpubUiVisibility();
        window.scrollTo(0, 0);
        await applySavedPos(lastBookKey, getSavedPos(lastBookKey), seq);
      } catch (error) {
        if (seq !== loadSeq) {
          return;
        }

        readingContent.textContent = "载入失败，请重新选择文件。";
        console.error(error);
      } finally {
        loading.hidden = true;
      }
    }

    selectButton.addEventListener("click", () => {
      fileInput.click();

    fontSizeInput.addEventListener("input", () => {
      root.style.setProperty("--font-size", `${fontSizeInput.value}px`);

    window.addEventListener(
      "scroll",
      () => {
        // 离开阅读视图或正在恢复位置时，浏览器会重置滚动位置并触发 scroll，
        // 必须忽略，否则会把刚存好的位置覆盖成 0。
        if (
          isLeavingReader ||
          isRestoringPos ||
          document.body.dataset.view !== "reader"
        ) {
          return;

        if (currentBookKey === null) {
          return;

        // 在滚动发生的当下就算出比例，只把写入延后防抖。
        const scrollElement = getScrollElement();
        const maxScroll = scrollElement.scrollHeight - window.innerHeight;
        const ratio =
          maxScroll > 0 ? scrollElement.scrollTop / maxScroll : 0;
        const bookKey = currentBookKey;
        const pos = {
          chapter: currentChapterIndex,
          ratio,
        };

        clearTimeout(progressSaveTimer);
        progressSaveTimer = setTimeout(() => {
          // 200ms 内可能已经切视图、或开始恢复上次位置。到点再确认一次，
          // 否则会把中间态的 0 写进去，覆盖刚恢复好的位置。
          if (
            isLeavingReader ||
            isRestoringPos ||
            document.body.dataset.view !== "reader"
          ) {
            return;
          }

          saveSetting(getPosKey(bookKey), JSON.stringify(pos));
        }, 200);
      },
      { passive: true }
    );

    async function importTextFile(file, seq, bookKey) {
      try {
        const buffer = await file.arrayBuffer();

        if (seq !== loadSeq) {
          return;
        }

        // 先解码校验再落库：二进制文件被 decodeText 拒绝时不该留下孤儿字节。
        const text = decodeText(buffer);

        if (seq !== loadSeq) {
          return;
        }

        await putBook(bookKey, buffer);

        if (seq !== loadSeq) {
          return;
        }

        const now = Date.now();
        const meta = {
          bookKey,
          name: file.name,
          size: file.size,
          chars: text.length,
          chapterCount: 1,
          addedAt: now,
          lastReadAt: now,
        };

        await putBookMeta(bookKey, meta);
        await renderShelf();
        updateStorageUsage();

        if (seq !== loadSeq) {
          return;
        }

        setReadingText(text);
        currentBookKey = bookKey;
        currentChapters = null;
        currentChapterIndex = 0;
        currentBookIsEpub = false;
        saveSetting(LAST_BOOK_KEY, bookKey);
        showReaderView();
        syncEpubUiVisibility();
        window.scrollTo(0, 0);
      } catch (error) {
        if (seq !== loadSeq) {
          return;
        }

        readingContent.textContent = `导入失败：${error.message}`;
        console.error(error);
      } finally {
        if (seq === loadSeq) {
          clearLoadingState();
          fileInput.value = "";
        }
      }
    }

    async function importEpubFile(file, seq, bookKey) {
      // 任何一步失败，前面写进去的都要清掉：半成品会出现在书架上，
      // 点开却报错，比完全没有更难排查。
      let wroteBook = false;
      let wroteChapters = false;
      let wroteResources = false;

      try {
        const info = await NovelEpub.inspectEpub(file);

        if (seq !== loadSeq) {
          return;
        }

        const chapterData = await NovelEpub.getChapters(file);

        if (seq !== loadSeq) {
          return;
        }

        const images = await NovelEpub.getAllImages(file);

        if (seq !== loadSeq) {
          return;
        }

        // 书自带的 CSS 和字体也要存下来，渲染章节时注入 Shadow DOM。
        const assets = await NovelEpub.getAssets(file);

        if (seq !== loadSeq) {
          return;
        }

        const cover = await NovelEpub.getCover(file);

        if (seq !== loadSeq) {
          return;
        }

        const buffer = await file.arrayBuffer();

        if (seq !== loadSeq) {
          return;
        }

        // 写入顺序固定：books → chapters → resources → meta。
        await putBook(bookKey, buffer);
        wroteBook = true;

        if (seq !== loadSeq) {
          return;
        }

        await putChapters(bookKey, chapterData.chapters);
        wroteChapters = true;

        if (seq !== loadSeq) {
          return;
        }

        // 图片、字体、CSS 一起写进 resources（同一个 store，两种 value 形状）。
        await putResources(bookKey, [
          ...images,
          ...assets.fonts.map((font) => ({
            path: font.href,
            blob: font.blob,
            mediaType: font.mediaType,
          })),
          ...assets.css.map((sheet) => ({
            path: sheet.href,
            text: sheet.text,
          })),
        ]);
        wroteResources = true;

        if (seq !== loadSeq) {
          return;
        }

        const now = Date.now();
        await putBookMeta(bookKey, {
          bookKey,
          name: file.name,
          size: file.size,
          format: "epub",
          chars: chapterData.chars,
          chapterCount: chapterData.chapters.length,
          imageCount: images.length,
          styleCount: assets.css.length,
          fontCount: assets.fonts.length,
          author: info.author || "",
          cover: cover ? cover.blob : null,
          readingMode: "chapter",
          addedAt: now,
          lastReadAt: now,
        });

        if (seq !== loadSeq) {
          return;
        }

        await renderShelf();

        if (seq !== loadSeq) {
          return;
        }

        updateStorageUsage();
        showShelfView();
        window.scrollTo(0, 0);
      } catch (error) {
        if (seq !== loadSeq) {
          return;
        }

        // 回滚已写入的部分，避免留下半成品。
        try {
          if (wroteResources) {
            await deleteResources(bookKey);
          }

          if (wroteChapters) {
            await deleteChapters(bookKey);
          }

          if (wroteBook) {
            await deleteBook(bookKey);
          }
        } catch (cleanupError) {
          console.error(cleanupError);
        }

        showToast("解析失败：" + error.message);
        console.error(error);
      } finally {
        if (seq === loadSeq) {
          clearLoadingState();
          fileInput.value = "";
        }
      }
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      const isEpub = /\.epub$/i.test(file.name);
      const seq = ++loadSeq;
      const bookKey = `${file.name}::${file.size}`;

      clearTimeout(progressSaveTimer);
      saveReadingPos();
      currentBookKey = null;
      showLoadingState();

      if (isEpub) {
        await importEpubFile(file, seq, bookKey);
      } else {
        await importTextFile(file, seq, bookKey);
      }
    });

    async function initializeReader() {
      history.replaceState({ view: "shelf" }, "");

      const startingLoadSeq = loadSeq;
      await renderShelf();

      if (loadSeq === startingLoadSeq) {
        openLastBook();
      }

      updateStorageUsage();
    }

    initializeReader();
  </script>
</body>
</html>
